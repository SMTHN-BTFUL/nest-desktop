[package]
name = "nest"
version = "1.1.0"
description = "The Nest — SMTHN.BTFUL dashboard desktop app"
authors = ["SMTHN.BTFUL"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
